<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121a2e" />
  <title>Оплата — Сонное царство</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/legal.css" />
  <style>
    .pay-box {
      margin-top: .5rem; padding: 1.15rem 1.1rem;
      border: 1px solid rgba(212,176,122,.35); border-radius: var(--radius);
      background:
        radial-gradient(ellipse 80% 60% at 90% 0%, rgba(212,176,122,.16), transparent 55%),
        var(--bg-elev);
    }
    .pay-box .sum {
      font-family: var(--font-d); font-size: 2rem; font-weight: 600;
      color: var(--accent); margin: .35rem 0 .6rem;
    }
    .pay-box h2 { margin: 0; font-family: var(--font-d); font-size: 1.45rem; }
    .pay-warn {
      margin: 1rem 0 0; padding: .85rem .9rem;
      border-radius: .9rem; border: 1px solid rgba(224,154,154,.4);
      background: rgba(180,70,70,.12); color: #f0d0d0; font-size: .9rem; line-height: 1.45;
    }
    .pay-ok {
      margin: 1rem 0 0; padding: .85rem .9rem;
      border-radius: .9rem; border: 1px solid rgba(120,180,120,.4);
      background: rgba(60,120,70,.15); color: #d0f0d4; font-size: .9rem; line-height: 1.45;
    }
    .pay-actions { display: grid; gap: .55rem; margin-top: 1.1rem; }
    .pay-actions .btn { width: 100%; text-align: center; text-decoration: none; }
    .btn[disabled], .btn.is-disabled {
      opacity: .45; pointer-events: none; cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"><div class="glow glow-a"></div><div class="glow glow-b"></div><div class="stars"></div></div>
  <main class="legal">
    <a class="back" href="./index.html">← На главную</a>
    <h1>Оформление</h1>
    <p class="lead">Оплата картой или СБП через ЮKassa. После оплаты разбор откроется автоматически.</p>

    <div class="pay-box" id="pay-box">
      <p class="num-kicker" style="margin:0;color:var(--accent);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase">Услуга</p>
      <h2 id="pay-title">…</h2>
      <div class="sum" id="pay-price">…</div>
      <p id="pay-meta" style="margin:0;color:var(--muted);font-size:.88rem"></p>
      <div id="pay-status" class="pay-warn" role="status">Проверяю настройки оплаты…</div>
      <div class="pay-actions">
        <button type="button" class="btn btn-primary is-disabled" id="pay-btn" disabled>Оплатить</button>
        <a class="btn btn-ghost" id="open-report" href="report.html" hidden style="text-decoration:none">Уже куплено — открыть</a>
        <a class="btn btn-ghost" href="prices.html">Все цены</a>
        <a class="btn btn-ghost" href="offer.html">Оферта</a>
      </div>
    </div>

    <p class="hint">
      Исполнитель: Желиховская Т. А., ИНН 615419935406, г. Таганрог.
      <a href="requisites.html" style="color:var(--accent)">Реквизиты</a>
    </p>
  </main>
  <script src="js/storage.js"></script>
  <script src="storage.js"></script>
  <script src="data/yookassa.js"></script>
  <script src="yookassa.js"></script>
  <script>
    (function () {
      var Y = window.YOOKASSA || {};
      var catalog = Y.catalog || {};
      var id = new URLSearchParams(location.search).get("item") || "sub";
      var item = catalog[id] || catalog.sub;
      if (!item) return;

      document.getElementById("pay-title").textContent = item.title;
      document.getElementById("pay-price").textContent = item.price;
      document.getElementById("pay-meta").textContent = item.meta || "";
      document.title = item.title + " — Сонное царство";
      document.getElementById("open-report").href = "report.html?item=" + encodeURIComponent(id);

      var statusEl = document.getElementById("pay-status");
      var btn = document.getElementById("pay-btn");
      var openBtn = document.getElementById("open-report");

      if (window.Store && Store.hasPurchase(id)) {
        statusEl.className = "pay-ok";
        statusEl.textContent = "Эта позиция уже открыта на этом устройстве.";
        openBtn.hidden = false;
        btn.hidden = true;
        return;
      }

      var ready = !!(Y.createPaymentUrl && Y.shopId);
      if (!ready) {
        statusEl.className = "pay-warn";
        statusEl.textContent =
          "ЮKassa подключена в кабинете. Осталось вписать shopId и URL оплаты в настройки сайта — напиши ассистенту shopId, дальше подключим кнопку.";
        return;
      }

      statusEl.className = "pay-ok";
      statusEl.textContent = "Можно оплатить. После оплаты разбор откроется сам.";
      btn.disabled = false;
      btn.classList.remove("is-disabled");
      btn.textContent = "Оплатить " + item.price;

      btn.addEventListener("click", async function () {
        btn.disabled = true;
        btn.textContent = "Создаю платёж…";
        try {
          var returnUrl =
            (Y.returnBase || location.origin + location.pathname.replace(/pay\.html.*/, "pay-success.html")) +
            "?item=" +
            encodeURIComponent(id);
          var res = await fetch(Y.createPaymentUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              item: id,
              amount: item.amount,
              description: item.title,
              return_url: returnUrl
            })
          });
          var data = await res.json();
          if (!res.ok || !data.confirmation_url) {
            throw new Error((data && data.error) || "fail");
          }
          if (data.id) {
            try {
              sessionStorage.setItem("sonnoe-pending-payment", JSON.stringify({ id: data.id, item: id }));
            } catch (_) {}
          }
          location.href = data.confirmation_url;
        } catch (e) {
          statusEl.className = "pay-warn";
          statusEl.textContent = "Не получилось создать платёж. Проверь Worker и ключи ЮKassa.";
          btn.disabled = false;
          btn.textContent = "Оплатить " + item.price;
        }
      });
    })();
  </script>
</body>
</html>
